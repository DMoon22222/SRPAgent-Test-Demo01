[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "srp-b-local"
version = "0.3.1"
description = "B group local schema 2.0 module with independent Docker execution"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7,<3", "jsonschema>=4.18,<5"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["."]
include = ["srp_b*", "app*"]
